services:
  api:
    image: python:3.12-slim
    working_dir: /app
    command: >
      sh -c "pip install -e '.[dev]' &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://campus:campus@postgres:5432/campus_psy_agent
    depends_on:
      - postgres
      - redis

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus
      POSTGRES_DB: campus_psy_agent
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
